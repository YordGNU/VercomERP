# ============================================================
# VercomERP – Docker Compose
# ============================================================
name: vercom

services:
  # ==========================================================
  # SQL Server
  # ==========================================================
  vercom-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vercom-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1434:1433"       # 🔒 solo localhost
    volumes:
        - vercom-mssql-data:/var/opt/mssql    # ← usa el volumen CON guión
    networks:
      - vercom-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================================
  # Aplicación ERP
  # ==========================================================
  vercom-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vercom-erp:2.0.0
    container_name: vercom-app
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=vercom-db,1433;Database=VercomERP;UID=sa;Password=Vercom#2026!StrongPass;TrustServerCertificate=True;MultipleActiveResultSets=true;Language=us_english
      - Jwt__Issuer=VercomERP
      - Jwt__Audience=VercomERPClientes
     
      - Jwt__SecretKey_FILE=/run/secrets/jwt_key
    secrets:
      - jwt_key
    volumes:
      - uploads-data:/app/wwwroot/uploads
    depends_on:
      vercom-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vercom-network

# ============================================================
# Volúmenes
# ============================================================
volumes:
  vercom-mssql-data:
    external: true    # ← "Este volumen YA existe, no lo toques"
  uploads-data:
    name: vercom_uploads-data

# ============================================================
# Redes
# ============================================================
networks:
  vercom-network:
    name: vercom-network
    driver: bridge

secrets:
  jwt_key:
    file: ./secrets/jwt_key.txt   