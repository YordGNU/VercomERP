# ============================================================
# VercomERP - Override de MONITORING
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
# ============================================================

services:
  # ==========================================================
  # Prometheus - métricas
  # ==========================================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: vercom-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - vercom-network

  # ==========================================================
  # Loki - logs centralizados
  # ==========================================================
  loki:
    image: grafana/loki:3.2.1
    container_name: vercom-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - vercom-network

  # ==========================================================
  # Promtail - envía logs de contenedores a Loki
  # ==========================================================
  promtail:
    image: grafana/promtail:3.2.1
    container_name: vercom-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - vercom-network

  # ==========================================================
  # Grafana - dashboards
  # ==========================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: vercom-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - vercom-network

  # ==========================================================
  # node-exporter - métricas del host
  # ==========================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vercom-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - vercom-network

volumes:
  prometheus-data:
    name: vercom_prometheus-data
  loki-data:
    name: vercom_loki-data
  grafana-data:
    name: vercom_grafana-data