map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 off for better WS compatibility with SignalR
    server_name vercom.local;

    ssl_certificate     /etc/nginx/certs/vercom.crt;
    ssl_certificate_key /etc/nginx/certs/vercom.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    location = /Account/Login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://vercom-app:8080;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /health {
        access_log off;
        proxy_pass http://vercom-app:8080/health;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /notificationHub {
        proxy_pass http://vercom-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://vercom-app:8080;
        include /etc/nginx/conf.d/proxy_params.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://vercom-app:8080;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}