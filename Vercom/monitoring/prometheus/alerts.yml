groups:
  - name: vercom-disponibilidad
    interval: 30s
    rules:
      - alert: AppDown
        expr: up{job="vercom-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: vercom-app
        annotations:
          summary: "VercomERP app caida"
          description: "La aplicacion lleva mas de 1 minuto sin responder."

      - alert: ScrapeFailure
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Target inaccesible"
          description: "Prometheus no puede scrapear un target."

  - name: vercom-rendimiento
    interval: 30s
    rules:
      - alert: CpuAlta
        expr: rate(process_cpu_seconds_total{job="vercom-app"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU alta"
          description: "CPU >80% sostenida."

      - alert: MemoriaAlta
        expr: process_working_set_bytes{job="vercom-app"} > 900 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria alta"
          description: "Uso de RAM >900MB."

      - alert: LatenciaAlta
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="vercom-app"}[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 alta"
          description: "p95 > 1 segundo."

  - name: vercom-errores
    interval: 30s
    rules:
      - alert: ErroresServidor
        expr: sum(rate(http_requests_received_total{job="vercom-app", code=~"5.."}[5m])) / sum(rate(http_requests_received_total{job="vercom-app"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Errores 5xx altos"
          description: "Mas del 5% de peticiones fallan."

  - name: vercom-runtime
    interval: 30s
    rules:
      - alert: GcPausasLargas
        expr: rate(system_runtime_dotnet_gc_pause_time[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pausas de GC largas"
          description: "Mas del 10% del tiempo en GC."

      - alert: ThreadPoolSaturado
        expr: system_runtime_dotnet_thread_pool_queue_length > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Thread pool saturado"
          description: "Mas de 50 items en cola."