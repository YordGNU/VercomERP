global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project: 'vercom'

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'vercom-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['vercom-app:8080']
        labels:
          service: 'api'

  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['vercom-node-exporter:9100']
  #       labels:
  #         service: 'host'