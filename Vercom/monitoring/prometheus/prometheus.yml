global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project: 'VERCOM'

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'VERCOM-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['VERCOM-app:8080']
        labels:
          service: 'api'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['VERCOM-node-exporter:9100']
        labels:
          service: 'host'